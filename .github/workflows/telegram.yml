name: Kollektíva robot

# Egyetlen robot, 5 percenként indul (a GitHub ezt néha 10–20 percre nyújtja):
#  1. jóváhagyási körök (REVIEW_SLOTS): a körök előtt kb. 25 perccel új rovatcikkek -> Telegramra; körök között
#     csak rendkívüli hír (BREAKING_SCORE). Éjfél után a napi horoszkóp és retro cikk is itt készül.
#  2. kb. 25 percig folyamatosan figyeli a Telegram-gombnyomásokat, és azonnal kirakja / módosítja a cikket;
#     hír csak a te jóváhagyásoddal kerül ki (AUTO_PUBLISH_NEWS=false), a saját anyag csendes időszakban magától
#  3. minden változás mentése; Cloudflare-build csak a havi keret szerint (scripts/commit.sh)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      ANTHROPIC_MODEL: claude-sonnet-5-5
      RETRO_AUTO_PUBLISH: "true"
      REVIEW_MODE: hybrid
      AUTO_PUBLISH_NEWS: "false"
      AUTO_PUBLISH_MIN: "30"
      REVIEW_SLOTS: "07:00,11:30,16:00,20:00"
      ARTICLES_PER_SLOT: "5"
      MAX_PER_SECTION_RUN: "2"
      # jóváhagyás nélkül kikerülő rovatok (jogi 🔴 esetén ezek is várnak); bulvár naponta max. 1, NASA/űr hetente max. 2
      AUTO_SECTIONS: "kozelet,eletmod,bulvar"
      DAILY_MAX_BULVAR: "5"
      WEEKLY_MAX_SPACE: "2"
      PITCHES_PER_SLOT: "0"
      BREAKING_SCORE: "11"
      SECTIONS_EVERY_MIN: "110"
      MAX_ARTICLES_PER_RUN: "4"
      DAILY_ARTICLE_LIMIT: "999"
      BUILD_BUDGET: "490"
    steps:
      - uses: actions/checkout@v4
        with:
          # mindig a legfrissebb main (NEM az indításkori állapot): a sorban várakozó futás különben régi
          # állapotfájlokkal indulna – ebből lett a dupla Instagram-poszt és az „elveszett” gombnyomás
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git beállítás
        run: |
          git config user.name "kollektiva-bot"
          git config user.email "bot@kollektiva.hu"
      - name: Instagram (minden cikkből, bulvár nélkül, Telegram-előnézettel)
        run: python instagram.py || true
      - name: Heti hírlevél (vasárnap reggel)
        run: python scripts/newsletter.py || true
      - name: Mentés
        run: bash scripts/commit.sh "Tartalom"
      # a gombnyomás-figyelés azonnal indul; az új tartalom (ha esedékes) párhuzamos szálon készül közben, így a
      # cikkírás alatt is azonnal reagál a gombokra (eddig a tartalomgyártás percekig blokkolta)
      - name: Telegram-figyelés + tartalom párhuzamosan (kb. 25 perc)
        run: python telegram_review.py --loop 1500 --content
      - name: Mentés (maradék)
        if: always()
        run: bash scripts/commit.sh "Jóváhagyás"
